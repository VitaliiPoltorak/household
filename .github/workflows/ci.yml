name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node 22 required — jsdom 30 → undici 8 uses webidl.util.markAsUncloneable
  # which only lands in Node 22. Local dev runs 22 too. Keep pnpm pinned in
  # lockstep with root package.json.
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.9'

jobs:
  # #343: runs unconditionally (not gated behind the `changes` job below) —
  # a secret can land in any file, docs included, so this is the one job
  # that always runs regardless of which areas changed.
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: '8.30.1'
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so a PR scan (below) can walk every commit, not
          # just the working tree at HEAD.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      # PRs scan full history (a leak could hide in any commit the PR
      # carries, not just its net diff); pushes to main scan only the
      # commits the push actually added, falling back to a full scan when
      # there's no meaningful before/after (new branch, workflow_dispatch).
      - name: Scan (pull request — full history)
        if: github.event_name == 'pull_request'
        run: gitleaks detect --source . --log-opts="--all" --redact -v

      - name: Scan (push — new commits)
        if: github.event_name != 'pull_request'
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO_SHA" ] || [ -z "$AFTER" ]; then
            gitleaks detect --source . --log-opts="--all" --redact -v
          else
            gitleaks detect --source . --log-opts="$BEFORE..$AFTER" --redact -v
          fi

  # #223: a docs-only or single-area change shouldn't pay for every test
  # layer. This job classifies the diff; the three real jobs below stay
  # gated with `if:` (not filtered out at the workflow `on:` level) so they
  # still show up as a "skipped" (not missing) check — a workflow-level
  # `paths:` filter that never runs the workflow at all leaves any branch
  # protection rule requiring these checks stuck pending forever.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      any: ${{ steps.filter.outputs.any }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend: &backend
              - 'apps/api-gateway/**'
              - 'apps/auth-service/**'
              - 'apps/household-service/**'
              - 'apps/finance-service/**'
              - 'apps/shopping-service/**'
              - 'apps/realtime-gateway/**'
              - 'libs/**'
              - 'scripts/**'
              - 'Dockerfile'
              - 'docker-compose.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig*.json'
              - 'turbo.json'
            any:
              - *backend
              - 'apps/web/**'
              - 'eslint.config.js'
              - '.prettierrc.json'
              - '.github/workflows/ci.yml'

  lint-and-build:
    name: Lint + Build
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  unit-tests:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      # `pnpm test:unit` → turbo → every package with a test:unit script
      # (7 packages today: api-gateway, auth-service, finance-service,
      # household-service, realtime-gateway, libs/common, libs/kafka, web).
      - name: Unit tests
        run: pnpm test:unit

  integration-tests:
    name: Integration tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    services:
      # Kafka is intentionally NOT a service — libs/testing mocks the
      # producer/consumer via createTestApp(), so no broker is needed.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: household
          POSTGRES_PASSWORD: household_secret
          POSTGRES_DB: household_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: household
      POSTGRES_PASSWORD: household_secret
      POSTGRES_DB: household_test
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      # libs/testing/jest.env.js provides a fallback for JWT_SECRET but only
      # if it's unset — leave it unset here so the fallback applies.

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Integration tests
        run: pnpm test:integration
