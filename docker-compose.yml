x-service-env: &service-env
  NODE_ENV: development
  LISTEN_HOST: 0.0.0.0
  REDIS_HOST: redis
  KAFKA_BROKERS: kafka:29092

services:
  # ─────────────────────────────────────────────────────────────
  # Infrastructure
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: household-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-household}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-household_secret}
      POSTGRES_DB: ${POSTGRES_DB:-household}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-household}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: household-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Pinned — apache/kafka:latest is a moving target; a silent version bump
  # on the next `docker compose pull`/recreate could change broker behavior
  # underneath everyone. Pin tracks whatever version is actually running;
  # bump deliberately, not by surprise.
  kafka:
    image: apache/kafka:4.3.1
    container_name: household-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Dual listener: containers use INTERNAL (kafka:29092), host processes
      # use EXTERNAL (localhost:9092). Prior single-listener config advertised
      # localhost:9092 to everyone — worked for hosts, broke for in-network
      # clients once metadata exchange redirected them.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # Developer tools — gated behind the `tools` profile so they don't run
  # in shared / staging deploys where the un-authenticated UIs would be a
  # data-exposure risk. Start locally with:
  #   docker compose --profile tools up -d
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: household-kafka-ui
    restart: unless-stopped
    profiles: [tools]
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: household
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  adminer:
    image: adminer
    container_name: household-adminer
    restart: unless-stopped
    profiles: [tools]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────
  # Application services (built from root Dockerfile per SERVICE)
  # ─────────────────────────────────────────────────────────────
  # All services pull env from .env (host defaults), then override the infra
  # host names so they resolve inside the compose network. Ports are exposed
  # for dev convenience (Swagger, direct debugging) — production would only
  # publish api-gateway :3000 and realtime-gateway :3010.
  #
  # Healthchecks (#205): every service below binds its port as the LAST step
  # of bootstrap (`await app.listen(...)` in main.ts, after the TypeORM
  # connection, ensureSchema(), synchronize, and Kafka onModuleInit all
  # complete) — so "port accepts a TCP connection" already proves the schema
  # exists and the service is actually ready, not just that the container
  # started. That's the guarantee `docker compose up -d --wait` and the
  # seed script (scripts/seed-e2e-user.js, #204) depend on. If a future
  # refactor moves app.listen() earlier (e.g. a lazy DB connection), this
  # assumption breaks silently — revisit these healthchecks if that happens.
  # `node:22-alpine` has no curl/wget, so probes shell out to `node -e`
  # instead of a shell script.
  # ─────────────────────────────────────────────────────────────

  api-gateway:
    build:
      context: .
      args:
        SERVICE: api-gateway
    image: household/api-gateway
    container_name: household-api-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      <<: *service-env
      # In-network overrides — .env has host-mode defaults.
      REDIS_PORT: '6379'
      AUTH_SERVICE_URL: http://auth-service:3001
      HOUSEHOLD_SERVICE_URL: http://household-service:3002
      FINANCE_SERVICE_URL: http://finance-service:3003
      SHOPPING_SERVICE_URL: http://shopping-service:3004
      # Web still runs on host; the browser talks to the gateway from there.
      CORS_ORIGIN: http://localhost:5173
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      household-service:
        condition: service_healthy
      finance-service:
        condition: service_healthy
      shopping-service:
        condition: service_healthy

  auth-service:
    build:
      context: .
      args:
        SERVICE: auth-service
    image: household/auth-service
    container_name: household-auth-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    env_file: .env
    environment:
      <<: *service-env
      POSTGRES_HOST: postgres
      # HttpOnly cookie requires HTTPS in secure mode — dev uses http://
      # localhost so keep secure=false when talking through the host browser.
      AUTH_COOKIE_SECURE: 'false'
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3001,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  household-service:
    build:
      context: .
      args:
        SERVICE: household-service
    image: household/household-service
    container_name: household-household-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3002"
    env_file: .env
    environment:
      <<: *service-env
      POSTGRES_HOST: postgres
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3002,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  finance-service:
    build:
      context: .
      args:
        SERVICE: finance-service
    image: household/finance-service
    container_name: household-finance-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:3003"
    env_file: .env
    environment:
      <<: *service-env
      POSTGRES_HOST: postgres
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3003,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  shopping-service:
    build:
      context: .
      args:
        SERVICE: shopping-service
    image: household/shopping-service
    container_name: household-shopping-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:3004:3004"
    env_file: .env
    environment:
      <<: *service-env
      POSTGRES_HOST: postgres
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3004,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  realtime-gateway:
    build:
      context: .
      args:
        SERVICE: realtime-gateway
    image: household/realtime-gateway
    container_name: household-realtime-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3010"
    env_file: .env
    environment:
      <<: *service-env
      WS_CORS_ORIGINS: http://localhost:5173
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3010,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  kafka_data:
